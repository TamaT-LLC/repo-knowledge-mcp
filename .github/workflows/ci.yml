name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit dependency graph and registry signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures
      - name: Run verified dependency lifecycle scripts
        run: npm rebuild
      - name: Run source checks and coverage gate
        run: npm run check
      # Offline M2 quality gate: recorded predictions only, no live network
      # access and no provider credential. Fails on any metric below its
      # reviewed minimum, on fixture drift, and on threshold/baseline or
      # prompt/schema/policy generation mismatches.
      - run: npm run golden
      - run: npm run quality:gate
      - run: npm run package:smoke
