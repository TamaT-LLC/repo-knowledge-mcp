name: Registry smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable npm version to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-smoke-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY_SMOKE_NPM_VERSION: 12.0.2

jobs:
  registry-smoke:
    name: registry smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Install release npm version
        run: npm install --global "npm@${REGISTRY_SMOKE_NPM_VERSION}"
      - name: Smoke exact version from npm registry
        env:
          REGISTRY_SMOKE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/registry-smoke.mjs
          --name "@tamat-llc/repo-knowledge-mcp"
          --version "$REGISTRY_SMOKE_VERSION"
