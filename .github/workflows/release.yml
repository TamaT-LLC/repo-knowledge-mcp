name: Release npm package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_NPM_VERSION: 12.0.2

jobs:
  verify:
    name: verify release (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm version
        run: npm install --global "npm@${RELEASE_NPM_VERSION}"
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify dependency install-script decisions
        run: npm run install-scripts:check
      - name: Audit dependency graph and registry signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures
      - name: Run verified dependency lifecycle scripts
        run: npm rebuild
      - name: Verify immutable release identity
        run: >-
          npm run --silent release:verify --
          --tag "${{ github.event.release.tag_name }}"
          --commit "${{ github.sha }}"
          --repository-visibility "${{ github.event.repository.visibility }}"
      - name: Run source checks and coverage gate
        run: npm run check
      - name: Run golden evaluations
        run: npm run golden
      - name: Run quality gate
        run: npm run quality:gate
      - name: Smoke packed package
        run: npm run package:smoke

  publish:
    name: publish exact tarball
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      name: ${{ steps.artifact.outputs.name }}
      version: ${{ steps.artifact.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Reject traditional npm credentials and auth config
        shell: bash
        run: |
          set -euo pipefail

          credential_env_names="$(
            env | cut -d= -f1 | grep -Ei \
              '^(NODE_AUTH_TOKEN|NPM_TOKEN|NPM_AUTH_TOKEN|YARN_NPM_AUTH_TOKEN|NPM_CONFIG_.*(AUTH|TOKEN|PASSWORD|USERNAME|CERTFILE|KEYFILE|USERCONFIG|GLOBALCONFIG)|npm_config_.*(auth|token|password|username|certfile|keyfile|userconfig|globalconfig))$' \
              || true
          )"
          if [[ -n "$credential_env_names" ]]; then
            while IFS= read -r credential_env_name; do
              echo "::error::Unexpected npm credential environment variable: ${credential_env_name}"
            done <<<"$credential_env_names"
            exit 1
          fi

          npm_config_json="$(npm config list --json)"
          if jq -e '
            to_entries
            | any(
                (.key | ascii_downcase | test("(^|:)(_auth|_authtoken|username|_password|certfile|keyfile)$")) and
                (.value != null and .value != "")
              )
          ' <<<"$npm_config_json" >/dev/null; then
            echo "::error::npm config contains a traditional authentication setting."
            exit 1
          fi

          npmrc_paths="$(
            printf '%s\n' \
              "${GITHUB_WORKSPACE}/.npmrc" \
              "$(npm config get userconfig)" \
              "$(npm config get globalconfig)" \
              | awk 'NF && !seen[$0]++'
          )"
          while IFS= read -r npmrc_path; do
            if [[ -f "$npmrc_path" ]] && grep -Eiq \
              '^[[:space:]]*([^#;=[:space:]]+:)?(_auth|_authToken|username|_password|certfile|keyfile)[[:space:]]*=' \
              "$npmrc_path"; then
              echo "::error::npm config file contains a traditional authentication setting: ${npmrc_path}"
              exit 1
            fi
          done <<<"$npmrc_paths"
      - name: Install trusted-publishing npm version
        run: npm install --global "npm@${RELEASE_NPM_VERSION}"
      - name: Verify inert bootstrap name reservation
        shell: bash
        run: |
          package='@tamat-llc/repo-knowledge-mcp@0.0.0-bootstrap.0'
          test "$(npm view "${package}" name)" = '@tamat-llc/repo-knowledge-mcp'
          test "$(npm view "${package}" version)" = '0.0.0-bootstrap.0'
          test "$(npm view "${package}" repository.url)" = 'git+https://github.com/TamaT-LLC/repo-knowledge-mcp.git'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify dependency install-script decisions
        run: npm run install-scripts:check
      - name: Re-audit dependency graph and registry signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures
      - name: Run verified dependency lifecycle scripts
        run: npm rebuild
      - name: Re-verify immutable release identity
        run: >-
          npm run --silent release:verify --
          --tag "${{ github.event.release.tag_name }}"
          --commit "${{ github.sha }}"
          --repository-visibility "${{ github.event.repository.visibility }}"
      - name: Build and inspect release artifact
        id: artifact
        run: >-
          node scripts/package-artifact-gate.mjs
          --pack-destination "${RUNNER_TEMP}/npm-release"
          --report "${RUNNER_TEMP}/npm-release/package-artifact-report.json"
      - name: Smoke the exact release tarball
        run: >-
          node scripts/package-smoke.mjs
          --tarball "${{ steps.artifact.outputs.tarball }}"
          --expected-name "${{ steps.artifact.outputs.name }}"
          --expected-version "${{ steps.artifact.outputs.version }}"
      - name: Publish exact tarball with provenance
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access public
          --tag latest
          --provenance
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.event.release.tag_name }}
          path: |
            ${{ steps.artifact.outputs.report }}
            ${{ steps.artifact.outputs.tarball }}
          if-no-files-found: warn
          retention-days: 30

  registry-smoke:
    name: registry smoke (Node ${{ matrix.node-version }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Install release npm version
        run: npm install --global "npm@${RELEASE_NPM_VERSION}"
      - name: Smoke exact version from npm registry
        run: >-
          node scripts/registry-smoke.mjs
          --name "${{ needs.publish.outputs.name }}"
          --version "${{ needs.publish.outputs.version }}"
